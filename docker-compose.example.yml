# Copy to docker-compose.yml and set ZWS_HOST to your Home Assistant / zwave-js-server host.
#   docker compose up -d   ->   http://localhost:8090
services:
  zwave-orchestrator:
    build: .
    # image: ghcr.io/roopesh/zwave-orchestrator:latest  # once published
    ports:
      - "8090:8090"
    environment:
      ZWS_HOST: "192.168.1.50" # host running the Z-Wave JS UI add-on
      ZWS_PORT: "3000" # the add-on's "Z-Wave JS server port"
    volumes:
      - ./data:/data # persists your gangs.yaml topology
    restart: unless-stopped
