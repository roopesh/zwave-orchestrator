<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Z-Wave Associations</title>
    <style>
      :root {
        --bg: #0f1420; --panel: #171e2e; --panel2: #1e2740; --line: #2b3550;
        --ink: #e7ecf5; --muted: #96a2bd; --accent: #5aa9ff; --good: #46c98b;
        --warn: #e6b64c; --bad: #f2685f; --chip: #263149;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      a { color: var(--accent); }
      header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
      header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
      .spacer { flex: 1; }
      .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 3px rgba(242,104,95,.15); }
      .dot.ok { background: var(--good); box-shadow: 0 0 0 3px rgba(70,201,139,.15); }
      button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); border-radius: 8px; padding: 7px 12px; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
      button.ghost { background: transparent; }
      button.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
      button.danger:hover { border-color: var(--bad); color: var(--bad); }
      main { max-width: 1040px; margin: 0 auto; padding: 20px; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .between { justify-content: space-between; }
      h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 12px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
      .gang-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .gang-head .name { font-size: 15px; font-weight: 640; }
      .load { color: var(--muted); }
      .comp { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
      .comp:first-of-type { border-top: none; }
      .comp .who { flex: 1; }
      .sub { color: var(--muted); font-size: 12.5px; }
      .chip { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); }
      .chip.good { color: var(--good); border-color: rgba(70,201,139,.4); }
      .chip.warn { color: var(--warn); border-color: rgba(230,182,76,.4); }
      .chip.bad { color: var(--bad); border-color: rgba(242,104,95,.4); }
      .issue { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(242,104,95,.08); border: 1px solid rgba(242,104,95,.3); font-size: 13px; }
      .issue.warn { background: rgba(230,182,76,.08); border-color: rgba(230,182,76,.3); }
      .issue .fix { color: var(--muted); margin-top: 4px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 600; }
      .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
      .badge.lr { color: var(--warn); }
      dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(560px, 92vw); }
      dialog::backdrop { background: rgba(4,8,16,.6); }
      .modal-h { padding: 16px 18px; border-bottom: 1px solid var(--line); font-weight: 640; }
      .modal-b { padding: 18px; max-height: 66vh; overflow: auto; }
      .modal-f { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; }
      label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; }
      input, select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: inherit; }
      .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
      .checks label { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--ink); font-size: 13px; }
      .checks input { width: auto; }
      .profile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
      .profile.sel { border-color: var(--accent); background: rgba(90,169,255,.06); }
      .profile .t { font-weight: 620; display: flex; align-items: center; gap: 8px; }
      .profile .s { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
      .profile ul { margin: 6px 0 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
      .empty { color: var(--muted); padding: 20px; text-align: center; }
      details summary { cursor: pointer; color: var(--muted); }
      .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
      .toast.show { opacity: 1; }
      .tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
      .tab { background: transparent; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 10px 16px; color: var(--muted); font-weight: 600; }
      .tab:hover { color: var(--ink); }
      .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
      td.diff { color: var(--warn); font-weight: 600; }
      .setline { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
      .setline select { flex: 1; }
      .setline button { padding: 4px 9px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Z-Wave Associations</h1>
      <span class="sub" id="homeid"></span>
      <div class="spacer"></div>
      <div class="status"><span class="dot" id="dot"></span><span id="connText">connecting…</span></div>
      <button class="ghost sm" id="btnDevices">Devices</button>
      <button class="ghost sm" id="btnRefresh">Refresh</button>
      <button class="ghost sm" id="btnSettings">Settings</button>
    </header>
    <main>
      <div id="banner"></div>
      <div class="tabs">
        <button class="tab active" data-tab="assoc">Associations</button>
        <button class="tab" data-tab="params">Parameters</button>
      </div>

      <div id="tabAssoc" class="tabpane">
        <div class="row between">
          <h2 style="margin:0">Gangs</h2>
          <div class="row">
            <button class="sm" id="btnSyncAll" title="Add missing links and remove any not in your setup">Sync all</button>
            <button class="sm" id="btnDiscover" title="Reverse-engineer gangs from your existing associations">Import from mesh</button>
            <button class="primary sm" id="btnNewGang">+ New gang</button>
          </div>
        </div>
        <div id="deviceInbox"></div>
        <div id="removedBanner"></div>
        <div id="gangs"></div>

        <h2>Nodes</h2>
        <div class="card"><div id="nodes"></div></div>
      </div>

      <div id="tabParams" class="tabpane" hidden>
        <div class="row between">
          <h2 style="margin:0">Policies</h2>
          <div class="row">
            <button class="sm" id="btnSyncAllParams" title="Apply every policy's settings to its devices">Sync all</button>
            <button class="sm" id="btnLedPolicy" title="Start a policy that syncs LED strip color/brightness across devices">LED appearance</button>
            <button class="primary sm" id="btnNewPolicy">+ New policy</button>
          </div>
        </div>
        <div id="policies"></div>

        <h2>Where devices differ</h2>
        <div class="card"><div id="paramBrowse"></div></div>
      </div>
    </main>

    <dialog id="gangModal"></dialog>
    <dialog id="policyModal"></dialog>
    <dialog id="discoverModal"></dialog>
    <dialog id="deviceModal"></dialog>
    <dialog id="settingsModal"></dialog>
    <div class="toast" id="toast"></div>

    <script>
      const $ = (s) => document.querySelector(s);
      let S = null; // latest /api/state

      const nodeLabel = (n) => (n ? `${n.location ? "[" + n.location + "] " : ""}${n.name || n.product || "#" + n.id}` : "?");
      const nodeById = (id) => (S?.nodes || []).find((n) => n.id === id);
      // Must match the server's fingerprintOf (product|location|name).
      const fingerprintOf = (n) => [n.product || "", n.location || "", n.name || ""].join("|");
      const preset = (id) => (S?.presets || []).find((p) => p.id === id);
      const capTitle = (id) => ((S?.capabilities || []).find((c) => c.id === id) || {}).title || id;
      const capOrder = () => (S?.capabilities || []).map((c) => c.id);
      // Effective capabilities for a gang: explicit > profile > defaults > full.
      function effCaps(g) {
        const fp = (id) => (preset(id) || {}).capabilities;
        return g.capabilities || fp(g.profile) || S.topology.defaults.capabilities || fp(S.topology.defaults.profile) || ["onoff", "level", "dim"];
      }
      const sameSet = (a, b) => a.length === b.length && [...a].sort().join() === [...b].sort().join();

      async function api(path, method = "GET", body) {
        const r = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
        return r.json();
      }
      function toast(msg) {
        const t = $("#toast"); t.textContent = msg; t.classList.add("show");
        clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
      }

      async function loadState() {
        S = await api("/api/state");
        render();
      }

      function render() {
        renderConn();
        renderBanner();
        renderDeviceInbox();
        renderRemoved();
        renderGangs();
        renderNodes();
      }

      // Surface untriaged ("new") devices and keep the Devices button's new-count fresh.
      function renderDeviceInbox() {
        const el = $("#deviceInbox");
        const newOnes = (S.nodes || []).filter((n) => !n.isController && n.device?.disposition === "new");
        const repairs = S.deviceChanges?.repairCandidates || [];
        const btn = $("#btnDevices");
        if (btn) btn.textContent = newOnes.length ? `Devices · ${newOnes.length} new` : "Devices";
        if (!el) return;
        let html = "";
        if (newOnes.length) html += `<div class="card" style="border-color:rgba(90,169,255,.4)"><b>${newOnes.length} new device(s)</b> on the mesh. Choose which belong in your gangs.<div style="margin-top:10px"><button class="primary sm" id="btnReviewDevices">Review devices</button></div></div>`;
        for (const rc of repairs) {
          html += `<div class="card" style="border-color:rgba(230,182,76,.45)"><b>Re-paired device?</b> <span class="sub">#${rc.from.id} is gone and #${rc.to} appeared with the same name & product.</span><div style="margin-top:10px"><button class="sm" data-remap="${rc.from.id}:${rc.to}">Remap #${rc.from.id} → #${rc.to} (updates gangs, policies, adoption)</button></div></div>`;
        }
        el.innerHTML = html;
        const r = document.getElementById("btnReviewDevices");
        if (r) r.onclick = openDeviceManager;
        el.querySelectorAll("[data-remap]").forEach((b) => (b.onclick = async () => {
          const [from, to] = b.dataset.remap.split(":").map(Number);
          toast("Remapping…");
          await api("/api/remap", "POST", { from, to });
          toast(`Remapped #${from} → #${to}`);
          await loadState();
        }));
      }

      function openDeviceManager() {
        const nodes = (S.nodes || []).filter((n) => !n.isController);
        const disp = new Map(nodes.map((n) => [n.id, n.device?.disposition || "new"]));
        const m = $("#deviceModal");
        const dispRow = (n) => {
          const d = disp.get(n.id);
          return `<div class="comp"><div class="who">#${n.id} ${esc(nodeLabel(n))}${d === "new" ? ' <span class="badge">new</span>' : ""}</div>
            <select data-disp="${n.id}" style="width:170px; flex:0 0 auto">
              <option value="adopted" ${d === "adopted" ? "selected" : ""}>In groups</option>
              <option value="ignored" ${d === "ignored" ? "selected" : ""}>Ignored</option>
              ${d === "new" ? '<option value="new" selected>New (untriaged)</option>' : ""}
            </select></div>`;
        };
        const paint = () => {
          const q = (m.querySelector("#dmSearch")?.value || "").toLowerCase();
          const list = nodes.filter((n) => !q || `#${n.id} ${n.location} ${n.name} ${n.product}`.toLowerCase().includes(q));
          const byRoom = {};
          for (const n of list) (byRoom[n.location || "—"] ??= []).push(n);
          m.querySelector("#dmBody").innerHTML = Object.keys(byRoom).sort().map((room) =>
            `<div style="margin-top:8px"><div class="sub" style="font-weight:600">${esc(room)}</div>${byRoom[room].map(dispRow).join("")}</div>`
          ).join("") || `<div class="sub" style="margin-top:8px">No matching devices.</div>`;
          m.querySelectorAll("[data-disp]").forEach((s) => s.addEventListener("change", () => disp.set(Number(s.dataset.disp), s.value)));
        };
        m.innerHTML = `<form method="dialog">
          <div class="modal-h">Devices</div>
          <div class="modal-b">
            <div class="sub" style="margin-bottom:8px">Choose which devices belong in the Groups UI. New switches default to “in groups”; ignored devices are hidden from the gang builder. (Parameters apply to all devices regardless.)</div>
            <input id="dmSearch" placeholder="Search…" style="margin-bottom:6px"/>
            <div class="row" style="gap:8px; margin-bottom:4px"><button type="button" class="sm" id="dmAdoptNew">Adopt all new</button><button type="button" class="sm ghost" id="dmIgnoreNew">Ignore all new</button></div>
            <div id="dmBody"></div>
          </div>
          <div class="modal-f"><button class="ghost" value="cancel">Cancel</button><button class="primary" value="save">Save</button></div>
        </form>`;
        paint();
        m.querySelector("#dmSearch").addEventListener("input", paint);
        m.querySelector("#dmAdoptNew").addEventListener("click", () => { for (const n of nodes) if (disp.get(n.id) === "new") disp.set(n.id, "adopted"); paint(); });
        m.querySelector("#dmIgnoreNew").addEventListener("click", () => { for (const n of nodes) if (disp.get(n.id) === "new") disp.set(n.id, "ignored"); paint(); });
        m.addEventListener("close", async function onClose() {
          m.removeEventListener("close", onClose);
          if (m.returnValue !== "save") return;
          const devices = [];
          for (const n of nodes) { const d = disp.get(n.id); if (d === "adopted" || d === "ignored") devices.push({ id: n.id, fingerprint: fingerprintOf(n), disposition: d }); }
          await api("/api/devices", "POST", { devices });
          toast("Saved device settings");
          await loadState();
        });
        m.showModal();
      }

      // Surface gang references to devices no longer on the mesh, with one-click cleanup.
      function renderRemoved() {
        const el = $("#removedBanner");
        if (!el) return;
        const meshIds = new Set((S.nodes || []).map((n) => n.id));
        const compGone = [], loadGone = [];
        for (const g of S.topology.gangs || []) {
          if (!meshIds.has(g.load)) loadGone.push(`#${g.load} (load of "${g.name}")`);
          for (const c of g.companions) { const id = typeof c === "number" ? c : c.node; if (!meshIds.has(id)) compGone.push(`#${id} (in "${g.name}")`); }
        }
        if (!compGone.length && !loadGone.length) { el.innerHTML = ""; return; }
        el.innerHTML = `<div class="card" style="border-color:rgba(230,182,76,.45)">
          <b>Removed devices referenced in your gangs</b>
          ${compGone.length ? `<div class="sub" style="margin-top:6px">Companions no longer on the mesh: ${esc(compGone.join(", "))}</div>` : ""}
          ${loadGone.length ? `<div class="sub" style="margin-top:6px">Loads no longer on the mesh: ${esc(loadGone.join(", "))} — edit or delete those gangs.</div>` : ""}
          ${compGone.length ? `<div style="margin-top:10px"><button class="sm" id="btnPrune">Remove ${compGone.length} missing companion(s) from gangs.yaml</button></div>` : ""}
        </div>`;
        const btn = document.getElementById("btnPrune");
        if (btn) btn.onclick = pruneRemoved;
      }

      async function pruneRemoved() {
        const meshIds = new Set((S.nodes || []).map((n) => n.id));
        const gangs = (S.topology.gangs || []).map((g) => ({ ...g, companions: g.companions.filter((c) => meshIds.has(typeof c === "number" ? c : c.node)) }));
        await saveGangs(gangs);
        toast("Pruned missing companions");
      }

      function renderBanner() {
        const b = $("#banner");
        if (S.connection.connected) { b.innerHTML = ""; return; }
        b.innerHTML = `<div class="card">
          <b>Not connected to zwave-js-server.</b> <span class="sub">${esc(S.connection.error || "")}</span>
          <div class="sub" style="margin:8px 0 12px">Set your Home Assistant host and the add-on's “Z-Wave JS server port” (default 3000). Enable that port under the add-on's Configuration → Network, then restart it.</div>
          <button class="primary sm" id="btnConnect">Open Settings</button>
        </div>`;
        const btn = document.getElementById("btnConnect");
        if (btn) btn.onclick = openSettings;
      }

      function renderConn() {
        const c = S.connection;
        $("#dot").className = "dot" + (c.connected ? " ok" : "");
        $("#connText").textContent = c.connected ? `connected · zwave-js ${c.version?.driverVersion || "?"}` : `not connected${c.error ? " · " + c.error : ""}`;
        $("#homeid").textContent = c.version?.homeId ? "home " + c.version.homeId : "";
      }

      // Per-companion status derived from the plan.
      function compStatus(g, node) {
        const issue = (S.plan.issues || []).find((i) => i.gang === g.name && i.node === node);
        if (issue && issue.severity === "error") return { kind: "bad", text: "blocked", issue };
        // pending links for this companion: forward (companion->load) or LED-sync (load->companion)
        const adds = (S.plan.actions || []).filter((a) => a.gang === g.name && (a.source === node || (a.source === g.load && a.target === node)));
        if (adds.length) return { kind: "warn", text: `${adds.length} link${adds.length > 1 ? "s" : ""} to add`, adds };
        if (issue) return { kind: "warn", text: issue.code.toLowerCase().replace(/_/g, " "), issue };
        return { kind: "good", text: "wired" };
      }

      function renderGangs() {
        const el = $("#gangs");
        const gangs = S.topology.gangs || [];
        if (!gangs.length) {
          el.innerHTML = `<div class="card empty">No gangs yet. Click <b>+ New gang</b> to group a load switch with its companions.</div>`;
          return;
        }
        el.innerHTML = gangs.map((g) => {
          const load = nodeById(g.load);
          const comps = g.companions.map((c) => {
            const id = typeof c === "number" ? c : c.node;
            const st = compStatus(g, id);
            const n = nodeById(id);
            const lr = n?.isLongRange ? ` <span class="badge lr">LR</span>` : "";
            const fix = st.issue?.remediation ? `<div class="issue ${st.issue.severity === "warning" ? "warn" : ""}">${esc(st.issue.message)}<div class="fix">→ ${esc(st.issue.remediation)}</div></div>` : "";
            return `<div class="comp"><div class="who">#${id} ${esc(nodeLabel(n))}${lr}</div><span class="chip ${st.kind}">${st.text}</span></div>${fix}`;
          }).join("");
          const does = effCaps(g).map((c) => `<span class="chip">${esc(capTitle(c))}</span>`).join(" ") + (g.ledSync ? ` <span class="chip good">LED tracking</span>` : "");
          const staleForGang = (S.stale || []).filter((a) => a.gang === g.name);
          const staleNote = staleForGang.length
            ? `<div class="issue warn"><b>${staleForGang.length}</b> link(s) not in this setup — <b>Sync</b> will remove them:<div class="fix">${staleForGang.map((a) => `#${a.source} ${esc(nodeLabel(nodeById(a.source)))} — ${esc(a.capabilityTitle || "extra")}`).join("<br>")}</div></div>`
            : "";
          return `<div class="card">
            <div class="gang-head">
              <span class="name">${esc(g.name)}</span>
              <span class="load">→ load #${g.load} ${esc(nodeLabel(load))}</span>
              <div class="spacer" style="flex:1"></div>
              <button class="sm" data-edit="${esc(g.name)}">Edit</button>
              <button class="sm primary" data-sync="${esc(g.name)}" title="Add missing links and remove any not in this setup">Sync</button>
              <button class="sm ghost" data-teardown="${esc(g.name)}" title="Remove all of this gang's associations. Note: Sync re-adds them — to permanently un-associate a switch, remove it from the gang (Edit) then Sync.">Teardown</button>
            </div>
            <div class="row" style="margin-bottom:8px; gap:6px"><span class="sub">Companions can:</span> ${does}</div>
            ${comps}
            ${staleNote}
          </div>`;
        }).join("");
      }

      function renderNodes() {
        const rows = (S.nodes || []).map((n) => `<tr>
          <td>#${n.id}</td><td>${esc(n.location || "")}</td><td>${esc(n.name || "")}</td>
          <td class="sub">${esc(n.product || "")}</td>
          <td>${n.isController ? '<span class="badge">controller</span>' : ""}${n.isLongRange ? ' <span class="badge lr">Long Range</span>' : ""}</td>
        </tr>`).join("");
        $("#nodes").innerHTML = `<table><thead><tr><th>ID</th><th>Location</th><th>Name</th><th>Product</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
      }

      const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

      // ---- writes ----
      async function doWrite(kind, filter) {
        const path = kind === "add" ? "/api/apply" : kind === "remove" ? "/api/teardown" : "/api/reconcile";
        toast(kind === "sync" ? "Syncing…" : kind === "add" ? "Applying…" : "Removing…");
        const r = await api(path, "POST", filter || {});
        const failed = (r.results || []).filter((x) => !x.ok).length;
        toast(`${(r.results || []).length - failed} change(s)${failed ? ", " + failed + " failed" : ""}`);
        await loadState();
      }

      // ---- gang editor (capability-based; no group numbers shown) ----
      function openGangModal(existing) {
        const nodes = (S.nodes || []).filter((n) => !n.isController);
        const g = existing || { name: "", load: nodes[0]?.id, companions: [] };
        const compIds = (g.companions || []).map((c) => (typeof c === "number" ? c : c.node));
        const checked = new Set(compIds);
        const caps = new Set(existing ? effCaps(g) : preset("full")?.capabilities || ["onoff", "level", "dim"]);

        const opt = (n) => `<option value="${n.id}" ${n.id === g.load ? "selected" : ""}>#${n.id} ${esc(nodeLabel(n))}</option>`;
        const compRow = (n) => `<label><input type="checkbox" data-comp value="${n.id}" ${checked.has(n.id) ? "checked" : ""}/> #${n.id} ${esc(nodeLabel(n))}${n.isLongRange ? " (Long Range)" : ""}${n.device?.disposition === "new" ? ' <span class="badge">new</span>' : ""}</label>`;
        const presetRow = (p) => `<div class="profile" data-preset="${p.id}" data-caps="${p.capabilities.join(',')}">
            <div class="t"><input type="radio" name="prof"/> ${esc(p.label)}${p.recommended ? ' <span class="chip good">recommended</span>' : ""}</div>
            <div class="s">${esc(p.summary)}</div>
          </div>`;
        const capRow = (c) => `<label title="${esc(c.description + " — e.g. " + c.example)}"><input type="checkbox" data-cap value="${c.id}"/> ${esc(c.title)}</label>`;

        const m = $("#gangModal");
        m.innerHTML = `<form method="dialog">
          <div class="modal-h">${existing ? "Edit gang" : "New gang"}</div>
          <div class="modal-b">
            <label>Gang name</label><input id="gName" value="${esc(g.name)}" placeholder="e.g. Kitchen Ceiling" />
            <label>Load switch (the one wired to the fixture)</label>
            <select id="gLoad">${nodes.map(opt).join("")}</select>
            <label>Companions (remotes that should control the load)</label>
            <input id="gCompSearch" placeholder="Search by name, room, model, #id…" style="margin-bottom:6px"/>
            <label style="display:flex; gap:6px; align-items:center; font-size:12px; color:var(--muted); margin:0 0 6px"><input type="checkbox" id="gShowAll" style="width:auto"/> show all devices (not just group-eligible)</label>
            <div id="gComps"></div>
            <label>What should the companions do?</label>
            <div id="gPresets">${(S.presets || []).map(presetRow).join("")}
              <div class="profile" data-preset="custom">
                <div class="t"><input type="radio" name="prof"/> Custom</div>
                <div class="checks" style="margin-top:8px">${(S.capabilities || []).map(capRow).join("")}</div>
              </div>
            </div>
            <label style="display:flex; align-items:center; gap:8px; margin-top:14px; color:var(--ink)"><input type="checkbox" id="gLed" ${existing?.ledSync ? "checked" : ""} style="width:auto"/> Mirror brightness to companions (so LED bars track the load)</label>
            <div class="sub" style="margin-top:2px">Association: wires the load back to each companion so their bars follow the load's level in real time. LED color/brightness is a <i>parameter</i> — set that in the Parameters tab.</div>
            <div class="issue warn" id="compat" style="display:none"></div>
          </div>
          <div class="modal-f">
            ${existing ? '<button class="ghost danger" value="delete">Delete</button>' : ""}
            <div class="spacer" style="flex:1"></div>
            <button class="ghost" value="cancel">Cancel</button>
            <button class="primary" value="save">Save</button>
          </div>
        </form>`;

        const capBoxes = () => [...m.querySelectorAll("[data-cap]")];
        const checkedComps = () => [...checked].filter((id) => id !== Number(m.querySelector("#gLoad").value) && nodes.some((n) => n.id === id));
        const syncCapBoxes = () => capBoxes().forEach((b) => (b.checked = caps.has(b.value)));

        // Companion checklist excludes the currently-selected load; repaints when the load changes.
        function paintComps() {
          const load = Number(m.querySelector("#gLoad").value);
          checked.delete(load);
          const box = m.querySelector("#gComps");
          const q = (m.querySelector("#gCompSearch")?.value || "").toLowerCase();
          const showAll = m.querySelector("#gShowAll")?.checked;
          const list = nodes.filter((n) => n.id !== load
            && (showAll || (n.device ? n.device.groupEligible : true))
            && (!q || `#${n.id} ${n.location} ${n.name} ${n.product}`.toLowerCase().includes(q)));
          const byRoom = {};
          for (const n of list) (byRoom[n.location || "—"] ??= []).push(n);
          box.innerHTML = Object.keys(byRoom).sort().map((room) =>
            `<div style="margin-top:6px"><div class="sub" style="font-weight:600">${esc(room)}</div><div class="checks">${byRoom[room].map(compRow).join("")}</div></div>`
          ).join("") || `<div class="sub" style="margin-top:6px">No matching devices.</div>`;
          box.querySelectorAll("[data-comp]").forEach((c) => c.addEventListener("change", () => {
            c.checked ? checked.add(Number(c.value)) : checked.delete(Number(c.value));
            recompute();
          }));
        }

        function recompute() {
          const arr = capOrder().filter((id) => caps.has(id));
          let matched = "custom";
          for (const p of S.presets || []) if (sameSet(p.capabilities, arr)) matched = p.id;
          m.querySelectorAll("[data-preset]").forEach((el) => {
            const on = el.getAttribute("data-preset") === matched;
            el.classList.toggle("sel", on);
            const r = el.querySelector("input[type=radio]");
            if (r) r.checked = on;
          });
          const load = Number(m.querySelector("#gLoad").value);
          const msgs = [];
          for (const id of checkedComps()) {
            if (id === load) continue;
            const n = nodeById(id), sup = new Set(n.supports || []);
            if (n.isLongRange) { msgs.push(`#${id} ${esc(nodeLabel(n))} is on Long Range — it can't be a companion via association.`); continue; }
            const lack = arr.filter((c) => !sup.has(c));
            if (lack.length) msgs.push(`#${id} ${esc(nodeLabel(n))} can't ${lack.map(capTitle).join(", ").toLowerCase()}.`);
          }
          const box = m.querySelector("#compat");
          box.style.display = msgs.length ? "block" : "none";
          box.innerHTML = msgs.map((x) => "⚠ " + x).join("<br>");
        }

        syncCapBoxes();
        paintComps();
        recompute();
        m.querySelector("#gLoad").addEventListener("change", () => { paintComps(); recompute(); });
        m.querySelector("#gCompSearch").addEventListener("input", paintComps);
        m.querySelector("#gShowAll").addEventListener("change", paintComps);
        m.querySelectorAll("[data-preset]").forEach((el) => el.addEventListener("click", (e) => {
          if (e.target.closest("[data-cap]")) return;
          const ca = el.getAttribute("data-caps");
          if (ca != null) { caps.clear(); ca.split(",").filter(Boolean).forEach((c) => caps.add(c)); syncCapBoxes(); }
          recompute();
        }));
        capBoxes().forEach((b) => b.addEventListener("change", () => { b.checked ? caps.add(b.value) : caps.delete(b.value); recompute(); }));

        m.addEventListener("close", async function onClose() {
          m.removeEventListener("close", onClose);
          if (m.returnValue === "cancel" || !m.returnValue) return;
          if (m.returnValue === "delete") { await saveGangs((S.topology.gangs || []).filter((x) => x.name !== existing.name)); return; }
          const name = m.querySelector("#gName").value.trim();
          const load = Number(m.querySelector("#gLoad").value);
          const companions = checkedComps().filter((id) => id !== load);
          const capsArr = capOrder().filter((id) => caps.has(id));
          if (!name || !load || !companions.length || !capsArr.length) { toast("Need a name, load, ≥1 companion, ≥1 behavior"); return; }
          const gang = { name, load, companions };
          if (m.querySelector("#gLed").checked) gang.ledSync = true;
          const match = (S.presets || []).find((p) => sameSet(p.capabilities, capsArr));
          if (match) gang.profile = match.id; else gang.capabilities = capsArr;
          const gangs = (S.topology.gangs || []).slice();
          const idx = existing ? gangs.findIndex((x) => x.name === existing.name) : -1;
          if (idx >= 0) gangs[idx] = gang; else gangs.push(gang);
          await saveGangs(gangs);
        });
        m.showModal();
      }

      async function saveGangs(gangs) {
        const topology = { defaults: S.topology.defaults, gangs };
        await api("/api/gangs", "POST", { topology });
        toast("Saved gangs.yaml");
        await loadState();
      }

      // ---- import gangs from existing associations ----
      async function openDiscover() {
        toast("Scanning mesh…");
        const { discovered, existingLoads } = await api("/api/discover");
        const existing = new Set(existingLoads || []);
        const m = $("#discoverModal");
        if (!discovered.length) {
          m.innerHTML = `<form method="dialog"><div class="modal-h">Import from mesh</div><div class="modal-b"><div class="empty">No companion associations found on the mesh to import.</div></div><div class="modal-f"><button class="primary" value="cancel">Close</button></div></form>`;
          m.showModal();
          return;
        }
        const row = (d, i) => {
          const isEx = existing.has(d.load);
          const comps = d.companions.map((id) => `#${id} ${esc(nodeLabel(nodeById(id)))}`).join(", ");
          const behaviors = d.capabilities.map(capTitle).join(" · ") || "—";
          return `<div class="card" style="margin-bottom:8px">
            <label style="display:flex; gap:8px; align-items:center; color:var(--ink); margin:0">
              <input type="checkbox" data-imp="${i}" ${isEx ? "" : "checked"} style="width:auto"/>
              <b>${esc(d.name)}</b> ${isEx ? '<span class="chip">already added</span>' : '<span class="chip good">new</span>'}
            </label>
            <div class="sub" style="margin-top:6px">Load #${d.load} · companions: ${comps}</div>
            <div class="sub">Behaviors: ${behaviors}</div>
          </div>`;
        };
        // Gangs in gangs.yaml whose load isn't a discovered load — likely stale/phantom; offer removal.
        const discLoads = new Set(discovered.map((d) => d.load));
        const extras = (S.topology.gangs || []).filter((g) => !discLoads.has(g.load));
        const extraRow = (g, i) => `<div class="card" style="margin-bottom:8px; border-color:rgba(230,182,76,.4)">
            <label style="display:flex; gap:8px; align-items:center; color:var(--ink); margin:0">
              <input type="checkbox" data-rm="${i}" style="width:auto"/>
              <b>${esc(g.name)}</b> <span class="chip warn">not in wiring</span>
            </label>
            <div class="sub" style="margin-top:6px">Load #${g.load} — this gang isn't backed by any associations on the mesh.</div>
          </div>`;
        m.innerHTML = `<form method="dialog">
          <div class="modal-h">Sync gangs with your existing wiring</div>
          <div class="modal-b">
            <div class="sub" style="margin-bottom:10px">Found ${discovered.length} gang(s) in your live associations. Pick which to add/update — rename and tune afterward.</div>
            ${discovered.map(row).join("")}
            ${extras.length ? `<h3 class="sub" style="margin:14px 0 8px">In your config but not on the mesh (${extras.length}) — check to remove:</h3>${extras.map(extraRow).join("")}` : ""}
          </div>
          <div class="modal-f"><button class="ghost" value="cancel">Cancel</button><button class="primary" value="import">Apply</button></div>
        </form>`;
        m.addEventListener("close", async function onClose() {
          m.removeEventListener("close", onClose);
          if (m.returnValue !== "import") return;
          const chosen = [...m.querySelectorAll("[data-imp]:checked")].map((c) => discovered[Number(c.dataset.imp)]);
          const removeNames = new Set([...m.querySelectorAll("[data-rm]:checked")].map((c) => extras[Number(c.dataset.rm)].name));
          if (!chosen.length && !removeNames.size) { toast("Nothing selected"); return; }
          let gangs = (S.topology.gangs || []).filter((g) => !removeNames.has(g.name));
          for (const d of chosen) {
            const gang = { name: d.name, load: d.load, companions: d.companions };
            const match = (S.presets || []).find((p) => sameSet(p.capabilities, d.capabilities));
            if (match) gang.profile = match.id; else if (d.capabilities.length) gang.capabilities = d.capabilities;
            const idx = gangs.findIndex((g) => g.load === d.load);
            if (idx >= 0) gangs[idx] = gang; else gangs.push(gang);
          }
          await saveGangs(gangs);
          toast(`Added/updated ${chosen.length}, removed ${removeNames.size}`);
        });
        m.showModal();
      }

      // ---- settings ----
      function openSettings() {
        const c = S.connection;
        const url = new URL(c.url);
        const m = $("#settingsModal");
        m.innerHTML = `<form method="dialog">
          <div class="modal-h">zwave-js-server connection</div>
          <div class="modal-b">
            <label>Host</label><input id="sHost" value="${esc(url.hostname)}" />
            <label>Port (the add-on's "Z-Wave JS server port", default 3000)</label><input id="sPort" value="${esc(url.port || "3000")}" />
            <p class="sub">Saved to config/config.json; the server reconnects on save.</p>
          </div>
          <div class="modal-f"><button class="ghost" value="cancel">Cancel</button><button class="primary" value="save">Save & connect</button></div>
        </form>`;
        m.addEventListener("close", async function onClose() {
          m.removeEventListener("close", onClose);
          if (m.returnValue !== "save") return;
          const host = m.querySelector("#sHost").value.trim();
          const port = Number(m.querySelector("#sPort").value);
          const r = await api("/api/config", "POST", { host, port });
          toast(r.connected ? "Connected ✓" : "Could not connect: " + (r.error || "?"));
          await loadState();
        });
        m.showModal();
      }

      // ---- parameters tab ----
      let P = null; // latest /api/params

      const pNode = (id) => (P?.nodes || []).find((n) => n.id === id);
      const pLabel = (n) => (n ? `${n.location ? "[" + n.location + "] " : ""}${n.name || n.model || "#" + n.id}` : "?");
      const pShort = (id) => pLabel(pNode(id));
      const paramDefAny = (param, prefer) => {
        for (const id of prefer || []) { const p = (P.params[id] || []).find((x) => x.param === param); if (p) return p; }
        for (const n of P.nodes || []) { const p = (P.params[n.id] || []).find((x) => x.param === param); if (p) return p; }
        return null;
      };
      const valueLabel = (def, v) => { if (v == null) return "?"; const o = def?.options?.find((x) => x.value === v); return o ? o.label : String(v); };

      async function loadParams() { P = await api("/api/params"); renderParams(); }
      function renderParams() { renderPolicies(); renderParamBrowse(); }

      function renderPolicies() {
        const el = $("#policies");
        const pols = P.policies || [];
        if (!pols.length) { el.innerHTML = `<div class="card empty">No policies yet. Click <b>+ New policy</b> to define parameter values and push them to your switches.</div>`; return; }
        el.innerHTML = pols.map((pol) => {
          const acts = (P.plan.actions || []).filter((a) => a.policy === pol.name);
          const issues = (P.plan.issues || []).filter((i) => i.policy === pol.name);
          const settings = pol.settings.map((s) => { const def = paramDefAny(s.param, pol.targets); return `<span class="chip">${esc(def ? def.label : "p" + s.param)}: ${esc(valueLabel(def, s.value))}</span>`; }).join(" ");
          const targets = pol.targets.map((id) => `#${id} ${esc(pShort(id))}`).join(", ");
          const drift = acts.length
            ? `<div class="issue warn"><b>${acts.length}</b> setting(s) out of sync — <b>Sync</b> will fix:<div class="fix">${acts.map((a) => `#${a.node} ${esc(pShort(a.node))} — ${esc(a.label)}: ${esc(a.currentLabel)} → ${esc(a.desiredLabel)}`).join("<br>")}</div></div>`
            : `<div class="sub" style="margin-top:6px">✓ all target devices in sync</div>`;
          const na = issues.length ? `<div class="sub" style="margin-top:6px">${issues.map((i) => esc(i.message)).join("<br>")}</div>` : "";
          return `<div class="card">
            <div class="gang-head"><span class="name">${esc(pol.name)}</span><div class="spacer" style="flex:1"></div>
              <button class="sm" data-pedit="${esc(pol.name)}">Edit</button>
              <button class="sm primary" data-psync="${esc(pol.name)}">Sync</button></div>
            <div class="row" style="gap:6px; margin-bottom:6px"><span class="sub">Settings:</span> ${settings}</div>
            <div class="sub">Devices: ${targets}</div>
            ${drift}${na}
          </div>`;
        }).join("");
      }

      function renderParamBrowse() {
        const el = $("#paramBrowse");
        const nodes = (P.nodes || []).filter((n) => !n.isController && (P.params[n.id] || []).length);
        const byModel = {};
        nodes.forEach((n) => (byModel[n.model] = byModel[n.model] || []).push(n));
        let html = "";
        for (const [model, ns] of Object.entries(byModel)) {
          const nums = new Set(); ns.forEach((n) => (P.params[n.id] || []).forEach((p) => nums.add(p.param)));
          const rows = [];
          for (const num of [...nums].sort((a, b) => a - b)) {
            const defs = ns.map((n) => (P.params[n.id] || []).find((x) => x.param === num));
            const def = defs.find(Boolean);
            if (!def || def.writeable === false) continue; // skip read-only diagnostics (e.g. Internal Temperature)
            const distinct = new Set(defs.map((p) => (p ? p.value : "?")));
            if (distinct.size <= 1) continue;
            const cells = defs.map((p) => `<td class="diff">${p ? esc(valueLabel(def, p.value)) : "—"}</td>`).join("");
            rows.push(`<tr><td>${esc(def.label)}</td>${cells}</tr>`);
          }
          const head = ns.map((n) => `<th>#${n.id}<br><span class="sub">${esc(n.location || "")}</span></th>`).join("");
          html += rows.length
            ? `<div class="sub" style="margin:10px 0 4px"><b>${esc(model)}</b> (${ns.length})</div><div style="overflow-x:auto"><table><thead><tr><th>Parameter</th>${head}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`
            : `<div class="sub" style="margin:10px 0 4px"><b>${esc(model)}</b> (${ns.length}) — all settings in sync ✓</div>`;
        }
        el.innerHTML = html || `<div class="empty sub">No devices with parameters.</div>`;
      }

      async function savePolicies(policies) { await api("/api/policies", "POST", { policies }); toast("Saved policies.yaml"); await loadParams(); }
      async function doParamSync(filter) {
        toast("Syncing…");
        const r = await api("/api/params/apply", "POST", filter || {});
        const failed = (r.results || []).filter((x) => !x.ok).length;
        toast(`${(r.results || []).length - failed} change(s)${failed ? ", " + failed + " failed" : ""}`);
        await loadParams();
      }

      function openPolicyModal(existing, seedParams, seedTargets) {
        const nodes = (P.nodes || []).filter((n) => !n.isController);
        const targets = new Set(existing ? existing.targets : seedTargets || []);
        const settings = existing ? existing.settings.map((s) => ({ param: s.param, value: s.value })) : [];
        if (!existing && seedParams) for (const num of seedParams) { const def = paramDefAny(num); if (def) settings.push({ param: num, value: def.default ?? def.options?.[0]?.value ?? def.value ?? 0 }); }
        const seedName = !existing && seedParams && seedParams.length ? "LED appearance" : "";
        const m = $("#policyModal");
        const availableParams = () => {
          const map = new Map();
          for (const id of targets) for (const p of P.params[id] || []) if (p.writeable && !map.has(p.param)) map.set(p.param, p);
          return [...map.values()].sort((a, b) => a.param - b.param);
        };

        m.innerHTML = `<form method="dialog">
          <div class="modal-h">${existing ? "Edit policy" : "New policy"}</div>
          <div class="modal-b">
            <label>Policy name</label><input id="pName" value="${existing ? esc(existing.name) : esc(seedName)}" placeholder="e.g. Inovelli defaults" />
            <label>Apply to devices</label>
            <input id="pSearch" placeholder="Search by model, name, room, #id…" style="margin-bottom:6px"/>
            <div id="pTargets"></div>
            ${existing ? "" : `<label>Prefill settings from a device (optional)</label><select id="pSeed"><option value="">— snapshot a well-configured switch —</option>${nodes.map((n) => `<option value="${n.id}">#${n.id} ${esc(pLabel(n))}</option>`).join("")}</select>`}
            <label>Settings (pick a parameter and the value you want)</label>
            <div id="pSettings"></div>
            <button type="button" class="sm" id="pAdd">+ Add setting</button>
            <div class="issue warn" id="pNote" style="display:none; margin-top:12px"></div>
          </div>
          <div class="modal-f">
            ${existing ? '<button class="ghost danger" value="delete">Delete</button>' : ""}
            <div class="spacer" style="flex:1"></div>
            <button class="ghost" value="cancel">Cancel</button>
            <button class="primary" value="save">Save</button>
          </div>
        </form>`;

        const valueControl = (i) => {
          const s = settings[i], def = paramDefAny(s.param, [...targets]);
          if (def?.options?.length) return `<select data-val="${i}">${def.options.map((o) => `<option value="${o.value}" ${o.value === s.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;
          return `<input type="number" data-val="${i}" value="${s.value}" ${def?.min != null ? `min="${def.min}"` : ""} ${def?.max != null ? `max="${def.max}"` : ""} style="max-width:130px"/>${def?.unit ? " " + esc(def.unit) : ""}`;
        };
        function paintSettings() {
          const avail = availableParams();
          const box = m.querySelector("#pSettings");
          box.innerHTML = settings.map((s, i) => {
            const inList = avail.some((p) => p.param === s.param);
            const extra = inList ? "" : `<option value="${s.param}" selected>${esc((paramDefAny(s.param, [...targets]) || {}).label || "p" + s.param)}</option>`;
            const opts = avail.map((p) => `<option value="${p.param}" ${p.param === s.param ? "selected" : ""}>${esc(p.label)}</option>`).join("");
            return `<div class="setline"><select data-param="${i}">${extra}${opts}</select> = ${valueControl(i)} <button type="button" class="ghost" data-del="${i}">✕</button></div>`;
          }).join("") || `<div class="sub" style="margin-bottom:7px">No settings yet — add one.</div>`;
          box.querySelectorAll("[data-param]").forEach((sel) => sel.addEventListener("change", () => { const i = Number(sel.dataset.param); settings[i].param = Number(sel.value); const def = paramDefAny(settings[i].param, [...targets]); settings[i].value = def?.default ?? def?.options?.[0]?.value ?? 0; paintSettings(); updateNote(); }));
          box.querySelectorAll("[data-val]").forEach((inp) => inp.addEventListener("change", () => { settings[Number(inp.dataset.val)].value = Number(inp.value); updateNote(); }));
          box.querySelectorAll("[data-del]").forEach((btn) => btn.addEventListener("click", () => { settings.splice(Number(btn.dataset.del), 1); paintSettings(); updateNote(); }));
        }
        function updateNote() {
          const msgs = [];
          for (const s of settings) { const lack = [...targets].filter((id) => !(P.params[id] || []).some((p) => p.param === s.param)); if (lack.length) { const def = paramDefAny(s.param, [...targets]); msgs.push(`${lack.map((id) => "#" + id).join(", ")} lack "${def ? def.label : "p" + s.param}" — skipped there.`); } }
          const note = m.querySelector("#pNote"); note.style.display = msgs.length ? "block" : "none"; note.innerHTML = msgs.map((x) => "⚠ " + x).join("<br>");
        }

        function paintTargets() {
          const q = (m.querySelector("#pSearch")?.value || "").toLowerCase();
          const list = nodes.filter((n) => !q || `#${n.id} ${n.location} ${n.name} ${n.model}`.toLowerCase().includes(q));
          const byModel = {};
          for (const n of list) (byModel[n.model || "Unknown"] ??= []).push(n);
          const box = m.querySelector("#pTargets");
          box.innerHTML = Object.keys(byModel).sort().map((model) => {
            const ns = byModel[model];
            return `<div style="margin-top:6px"><div class="row" style="gap:8px"><span class="sub" style="font-weight:600">${esc(model)} (${ns.length})</span><button type="button" class="sm ghost" data-selall="${esc(model)}" style="padding:1px 8px">select all</button></div><div class="checks">${ns.map((n) => `<label><input type="checkbox" data-tgt value="${n.id}" ${targets.has(n.id) ? "checked" : ""}/> #${n.id} ${esc(pLabel(n))}</label>`).join("")}</div></div>`;
          }).join("") || `<div class="sub" style="margin-top:6px">No matching devices.</div>`;
          box.querySelectorAll("[data-tgt]").forEach((c) => c.addEventListener("change", () => { c.checked ? targets.add(Number(c.value)) : targets.delete(Number(c.value)); paintSettings(); updateNote(); }));
          box.querySelectorAll("[data-selall]").forEach((b) => b.addEventListener("click", () => { const model = b.dataset.selall; for (const n of nodes) if ((n.model || "Unknown") === model) targets.add(n.id); paintTargets(); paintSettings(); updateNote(); }));
        }

        paintTargets(); paintSettings(); updateNote();
        m.querySelector("#pSearch").addEventListener("input", paintTargets);
        const seedSel = m.querySelector("#pSeed");
        if (seedSel) seedSel.addEventListener("change", () => {
          const id = Number(seedSel.value); if (!id) return;
          targets.add(id);
          paintTargets();
          settings.length = 0;
          for (const p of P.params[id] || []) if (p.writeable && p.value != null && p.default != null && p.value !== p.default) settings.push({ param: p.param, value: p.value });
          paintSettings(); updateNote();
          toast(`Loaded ${settings.length} customized setting(s) from #${id}`);
        });
        m.querySelector("#pAdd").addEventListener("click", () => { const a = availableParams()[0]; settings.push({ param: a ? a.param : 1, value: a ? (a.default ?? a.options?.[0]?.value ?? 0) : 0 }); paintSettings(); updateNote(); });

        m.addEventListener("close", async function onClose() {
          m.removeEventListener("close", onClose);
          if (m.returnValue === "cancel" || !m.returnValue) return;
          if (m.returnValue === "delete") { await savePolicies((P.policies || []).filter((x) => x.name !== existing.name)); return; }
          const name = m.querySelector("#pName").value.trim();
          const tgts = [...targets];
          if (!name || !tgts.length || !settings.length) { toast("Need a name, ≥1 device, ≥1 setting"); return; }
          const policy = { name, targets: tgts, settings: settings.map((s) => ({ param: s.param, value: s.value })) };
          const pols = (P.policies || []).slice();
          const idx = existing ? pols.findIndex((x) => x.name === existing.name) : -1;
          if (idx >= 0) pols[idx] = policy; else pols.push(policy);
          await savePolicies(pols);
        });
        m.showModal();
      }

      // ---- events ----
      $("#btnRefresh").onclick = async () => { await loadState(); if (P) await loadParams(); };
      $("#btnDevices").onclick = openDeviceManager;
      $("#btnSettings").onclick = openSettings;
      $("#btnNewGang").onclick = () => openGangModal(null);
      $("#btnDiscover").onclick = openDiscover;
      $("#btnSyncAll").onclick = () => doWrite("sync", {});
      $("#gangs").addEventListener("click", (e) => {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.sync) doWrite("sync", { gang: t.dataset.sync });
        else if (t.dataset.teardown) doWrite("remove", { gang: t.dataset.teardown });
        else if (t.dataset.edit) openGangModal((S.topology.gangs || []).find((g) => g.name === t.dataset.edit));
      });

      document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
        document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
        const tab = t.dataset.tab;
        $("#tabAssoc").hidden = tab !== "assoc";
        $("#tabParams").hidden = tab !== "params";
        if (tab === "params" && !P) loadParams();
      });
      $("#btnNewPolicy").onclick = () => openPolicyModal(null);
      $("#btnLedPolicy").onclick = () => {
        const led = new Set(), tgts = new Set();
        for (const n of P?.nodes || []) for (const p of P.params[n.id] || []) if (p.writeable && /led/i.test(p.label)) { led.add(p.param); tgts.add(n.id); }
        if (!led.size) { toast("No LED parameters found on your devices"); return; }
        openPolicyModal(null, [...led].sort((a, b) => a - b), [...tgts]);
      };
      $("#btnSyncAllParams").onclick = () => doParamSync({});
      $("#policies").addEventListener("click", (e) => {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.psync) doParamSync({ policy: t.dataset.psync });
        else if (t.dataset.pedit) openPolicyModal((P.policies || []).find((p) => p.name === t.dataset.pedit));
      });

      loadState();
    </script>
  </body>
</html>
