# My companion-switch topology. See gangs.example.yaml for the annotated template.

defaults:
  profile: full # on/off + brightness sync + hold-to-dim, resolved per device

gangs:
  - name: Kitchen Ceiling
    load: 2 # [Kitchen] Ceiling Lights
    companions: [3, 4] # Family Room + Garage Entry remotes

  - name: Kitchen Counter
    load: 6 # [Kitchen] Counter Lights
    companions: [5, 256] # 256 is on Long Range — planner flags it as ineligible
