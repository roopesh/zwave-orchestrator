blueprint:
  name: Scene Controller → Covers (Zooz ZEN32 & similar)
  author: zwave-associations
  description: >
    Drive covers/shades from the buttons on a Z-Wave scene controller. Built for
    the Zooz ZEN32 (5 buttons) but works with any zwave-js device that exposes
    per-button "Scene" event entities.

    Every button is INDEPENDENT and OPTIONAL — set only the ones you use. A
    button with action "None" (or no cover picked) is ignored, so this works for
    a single shade, a dual light-filtering + blackout pair, or anything between.

    Gestures: a single TAP runs the cover to its end (fully open / fully close).
    PRESS-AND-HOLD starts it moving and RELEASE stops it partway — so hold gives
    you partial positions. Toggle/Stop act on a tap.

    Buttons are numbered by Scene number (1–5). Which physical button is which
    varies by device — fill these in, press each button, and watch which cover
    moves to learn the mapping.
  domain: automation
  input:
    controller:
      name: Scene controller
      description: >
        Pick the controller's button-event entities. On a Zooz ZEN32 these are
        its "… Scene 001 / 002 / …" event entities — select all of them.
      input:
        scene_events:
          name: Button-event entities
          selector:
            entity:
              domain: event
              multiple: true
    button_1:
      name: Button / Scene 1
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        b1_action:
          name: What this button does
          default: "None"
          selector:
            select:
              options: ["None", "Open", "Close", "Toggle", "Stop"]
        b1_cover:
          name: Cover(s) to control
          default: []
          selector:
            entity:
              domain: cover
              multiple: true
    button_2:
      name: Button / Scene 2
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        b2_action:
          name: What this button does
          default: "None"
          selector:
            select:
              options: ["None", "Open", "Close", "Toggle", "Stop"]
        b2_cover:
          name: Cover(s) to control
          default: []
          selector:
            entity:
              domain: cover
              multiple: true
    button_3:
      name: Button / Scene 3
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        b3_action:
          name: What this button does
          default: "None"
          selector:
            select:
              options: ["None", "Open", "Close", "Toggle", "Stop"]
        b3_cover:
          name: Cover(s) to control
          default: []
          selector:
            entity:
              domain: cover
              multiple: true
    button_4:
      name: Button / Scene 4
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        b4_action:
          name: What this button does
          default: "None"
          selector:
            select:
              options: ["None", "Open", "Close", "Toggle", "Stop"]
        b4_cover:
          name: Cover(s) to control
          default: []
          selector:
            entity:
              domain: cover
              multiple: true
    button_5:
      name: Button / Scene 5 (often the big relay button)
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        b5_action:
          name: What this button does
          default: "None"
          selector:
            select:
              options: ["None", "Open", "Close", "Toggle", "Stop"]
        b5_cover:
          name: Cover(s) to control
          default: []
          selector:
            entity:
              domain: cover
              multiple: true

# queued so a hold's repeated events + other buttons don't stomp each other; the
# actions are idempotent (open/close/stop) so serializing them is safe.
mode: queued
max: 15
max_exceeded: silent

# Keep !input only as direct top-level variable values (always substituted), then
# build the scene->config lookup inside a template from those resolved variables.
variables:
  a1: !input b1_action
  c1: !input b1_cover
  a2: !input b2_action
  c2: !input b2_cover
  a3: !input b3_action
  c3: !input b3_cover
  a4: !input b4_action
  c4: !input b4_cover
  a5: !input b5_action
  c5: !input b5_cover
  scene: "{{ trigger.entity_id.rsplit('_', 1)[-1] | int(0) }}"
  gesture: "{{ trigger.to_state.attributes.event_type }}"
  act: "{{ {1: a1, 2: a2, 3: a3, 4: a4, 5: a5}.get(scene, 'None') }}"
  covers: "{{ {1: c1, 2: c2, 3: c3, 4: c4, 5: c5}.get(scene, []) }}"

trigger:
  - platform: state
    entity_id: !input scene_events

condition:
  # A mapped button, and a real button gesture (ignore the null on restore).
  - "{{ (covers | count) > 0 and act not in ['None', none] }}"
  - "{{ gesture in ['KeyPressed', 'KeyHeldDown', 'KeyReleased'] }}"

action:
  - choose:
      # OPEN — tap/hold run it open; release stops it (partial).
      - conditions: "{{ act == 'Open' }}"
        sequence:
          - choose:
              - conditions: "{{ gesture in ['KeyPressed', 'KeyHeldDown'] }}"
                sequence:
                  - service: cover.open_cover
                    target: { entity_id: "{{ covers }}" }
              - conditions: "{{ gesture == 'KeyReleased' }}"
                sequence:
                  - service: cover.stop_cover
                    target: { entity_id: "{{ covers }}" }
      # CLOSE — tap/hold run it closed; release stops it (partial).
      - conditions: "{{ act == 'Close' }}"
        sequence:
          - choose:
              - conditions: "{{ gesture in ['KeyPressed', 'KeyHeldDown'] }}"
                sequence:
                  - service: cover.close_cover
                    target: { entity_id: "{{ covers }}" }
              - conditions: "{{ gesture == 'KeyReleased' }}"
                sequence:
                  - service: cover.stop_cover
                    target: { entity_id: "{{ covers }}" }
      # TOGGLE / STOP — on a tap only.
      - conditions: "{{ act == 'Toggle' and gesture == 'KeyPressed' }}"
        sequence:
          - service: cover.toggle
            target: { entity_id: "{{ covers }}" }
      - conditions: "{{ act == 'Stop' and gesture == 'KeyPressed' }}"
        sequence:
          - service: cover.stop_cover
            target: { entity_id: "{{ covers }}" }
